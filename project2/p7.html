<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./p7.css">
</head>
<body style="background-color: lightblue; ">
    <div class="container">
        <h1>Astrology Insights</h1>
        <form id="Astroform">
            <label for="name">First Name</label>
            <input type="text" id="name" name="name" required>

            <label for="surname">Surname</label>
            <input type="text" id="surname" name="surname" required>

            <label for="day">Date of Birth(day)</label>
            <input type="number" id="day" name="day" min="1" max="31" required>

            <label for="month">Month:</label>
            <input type="number" id="month" name="month" min="1" max="12" required>

            <label for="year">Year:</label>
            <input type="number" id="year" name="year" min="1990" max="2015" required>

            <input type="submit" value="Get Insights">
        </form>
        <div class="result" id="result"></div>
    </div>
    <script src="./p7.js"></script>
</body>
</html>
